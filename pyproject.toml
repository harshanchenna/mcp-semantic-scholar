[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harshanchenna-mcp-semantic-scholar"
version = "0.1.0"
description = "MCP server for the Semantic Scholar academic paper search API"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Harshan Chenna", email = "harshu.c18@gmail.com" }
]
keywords = ["mcp", "semantic-scholar", "research", "papers", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.urls]
Homepage = "https://github.com/harshanchenna/mcp-semantic-scholar"
Repository = "https://github.com/harshanchenna/mcp-semantic-scholar"
Issues = "https://github.com/harshanchenna/mcp-semantic-scholar/issues"

[project.scripts]
semantic-scholar-mcp = "semantic_scholar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_scholar_mcp"]
